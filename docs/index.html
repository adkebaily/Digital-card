<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d12">
<title>Business card</title>
<meta name="description" content="Digital business card">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5fc;
    --card: #ffffff;
    --text: #0f1424;
    --muted: #5a6273;
    --line: rgba(15, 18, 25, 0.08);
    --row: #f6f7fa;
    --row-hover: #eceef3;
    --accent: #4f46e5;
    --accent-2: #06b6d4;
    --accent-3: #7c3aed;
    --on-accent: #ffffff;
    --shadow: 0 30px 60px -20px rgba(49, 46, 129, 0.25), 0 2px 6px rgba(20, 30, 60, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #07080c;
      --card: #10131a;
      --text: #eef0f5;
      --muted: #9097a8;
      --line: rgba(255, 255, 255, 0.07);
      --row: #161a23;
      --row-hover: #1c212c;
      --accent: #818cf8;
      --accent-2: #22d3ee;
      --accent-3: #a78bfa;
      --on-accent: #0a0d18;
      --shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
  }
  :root[data-theme="dark"] {
    --bg: #07080c; --card: #10131a; --text: #eef0f5; --muted: #9097a8;
    --line: rgba(255,255,255,0.07); --row: #161a23; --row-hover: #1c212c;
    --accent: #818cf8; --accent-2: #22d3ee; --accent-3: #a78bfa; --on-accent: #0a0d18;
    --shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: minmax(0, 420px);
    justify-content: center;
    align-content: center;
    padding: 24px 16px 40px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  /* soft background glow */
  body::before {
    content: "";
    position: fixed;
    inset: -20vmax;
    background:
      radial-gradient(40vmax 40vmax at 15% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(35vmax 35vmax at 90% 90%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 60%);
    z-index: -1;
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  .banner {
    height: 112px;
    background:
      linear-gradient(120deg, var(--accent) 0%, var(--accent-3) 50%, var(--accent-2) 100%);
    position: relative;
    overflow: hidden;
  }
  /* subtle signal-wave motif — nod to signal processing */
  .banner svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; }

  .head { padding: 0 24px; margin-top: -48px; position: relative; }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 4px solid var(--card);
    background: linear-gradient(135deg, #1b2030, #2b3350);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 32px; letter-spacing: .5px;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .theme-toggle {
    position: absolute; right: 20px; top: 58px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--row);
    color: var(--muted); cursor: pointer;
    display: grid; place-items: center;
  }
  .theme-toggle:hover { color: var(--text); }

  h1 { font-family: "Plus Jakarta Sans", "Inter", sans-serif; font-size: 25px; font-weight: 800; letter-spacing: -.02em; margin-top: 14px; line-height: 1.2; }
  .role {
    font-size: 14.5px; font-weight: 500; margin-top: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-3) 55%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  /* raccourcis vers le portfolio : CV, agent CK-AI, projets */
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 24px 0; }
  .quick a {
    display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border-radius: 16px;
    background: color-mix(in srgb, var(--accent) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    color: var(--text); text-decoration: none; font-size: 12.5px; font-weight: 600; text-align: center;
    transition: transform .15s ease, background .15s ease;
  }
  .quick a:hover { background: color-mix(in srgb, var(--accent) 15%, var(--card)); transform: translateY(-2px); }
  .quick a:active { transform: scale(.97); }
  .quick svg { width: 20px; height: 20px; color: var(--accent); }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .bio { color: var(--muted); font-size: 14px; line-height: 1.55; margin-top: 14px; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tag {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    padding: 5px 9px; border-radius: 999px;
    background: var(--row); border: 1px solid var(--line); color: var(--muted);
  }

  .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 20px 24px 6px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; border-radius: 14px; border: 0; cursor: pointer;
    font: 600 15px "Inter", sans-serif; text-decoration: none;
    transition: transform .15s ease, filter .15s ease, background .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(120deg, var(--accent), var(--accent-3)); color: var(--on-accent); box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-ghost { width: 48px; background: var(--row); color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--row-hover); }

  .links { list-style: none; padding: 14px 16px 8px; display: grid; gap: 8px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; border-radius: 16px;
    background: var(--row); border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    transition: background .15s ease, transform .15s ease;
    opacity: 0; animation: fadeIn .5s ease forwards;
  }
  .link:hover { background: var(--row-hover); transform: translateX(2px); }
  .link:active { transform: scale(.985); }
  .ico {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: grid; place-items: center; color: #fff;
  }
  .ico svg { width: 20px; height: 20px; }
  .txt { min-width: 0; flex: 1; }
  .label { font-size: 14.5px; font-weight: 600; }
  .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .chev { color: var(--muted); flex: none; }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px 22px; color: var(--muted); font-size: 12px;
  }
  footer button {
    background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer;
    display: inline-flex; gap: 6px; align-items: center;
  }
  footer button:hover { color: var(--text); }

  /* QR modal (for sharing your card in person, screen to screen) */
  .modal {
    position: fixed; inset: 0; display: none; place-items: center; padding: 16px;
    background: rgba(5, 7, 12, .6); backdrop-filter: blur(6px); z-index: 10;
  }
  .modal.open { display: grid; }
  .modal-box {
    background: var(--card); border-radius: 24px; padding: 24px; text-align: center;
    width: 100%; max-width: 320px; box-shadow: var(--shadow); animation: rise .35s ease both;
  }
  .qr { background: #fff; border-radius: 16px; padding: 16px; display: inline-block; margin: 6px 0 14px; }
  .qr img, .qr canvas { display: block; width: 220px !important; height: 220px !important; }
  .modal-box p { color: var(--muted); font-size: 13px; }
  .modal-box .btn { width: 100%; margin-top: 16px; background: var(--row); color: var(--text); border: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--card); padding: 10px 16px; border-radius: 12px;
    font-size: 13.5px; font-weight: 500; opacity: 0; transition: all .25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  body:not(.ready) .card { visibility: hidden; }
  .locked { color: var(--muted); font-size: 15px; text-align: center; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .link { opacity: 1; }
  }
  /* ---------- Effets dynamiques ---------- */
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  body { perspective: 1200px; }
  /* l'entrée ne doit pas figer transform, sinon l'inclinaison serait ignorée */
  .card { position: relative; will-change: transform; animation-fill-mode: backwards; }
  .banner svg { overflow: hidden; }
  html, body { overflow-x: clip; }
  /* reflet holographique qui suit le doigt, la souris ou l'inclinaison du téléphone */
  .sheen {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; mix-blend-mode: soft-light;
    background:
      radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .55), transparent 55%),
      linear-gradient(115deg, transparent 20%, rgba(124, 58, 237, .25) 40%, rgba(6, 182, 212, .25) 55%, transparent 75%);
    background-size: 100% 100%, 220% 220%; background-position: 0 0, var(--hx, 50%) 50%;
    opacity: 0; transition: opacity .4s ease;
  }
  .card.live .sheen { opacity: 1; }
  /* ondes du signal qui défilent dans le bandeau */
  .banner .w1 { animation: flow 6s linear infinite; --p: -100px; }
  .banner .w2 { animation: flow 9s linear infinite; --p: -160px; }
  .banner .w3 { animation: flow 4s linear infinite; --p: -60px; }
  @keyframes flow { to { transform: translateX(var(--p)); } }
  /* anneau en dégradé qui tourne autour de la photo */
  .avatar-wrap { position: relative; width: 96px; height: 96px; }
  .avatar-wrap::before {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent-3), var(--accent-2), transparent 70%, var(--accent));
    animation: spin 6s linear infinite;
  }
  .avatar-wrap .avatar { position: relative; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* titre en dégradé qui ondule lentement */
  .role { background-image: linear-gradient(90deg, var(--accent), var(--accent-3), var(--accent-2), var(--accent)); background-size: 200% 100%; animation: shimmer 6s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .sheen { display: none; }
    .card { transform: none !important; }
  }
</style>
</head>
<body>

<main class="card" id="card">
  <div class="sheen" aria-hidden="true"></div>
  <div class="banner" aria-hidden="true">
    <svg viewBox="0 0 400 112" preserveAspectRatio="none">
      <path class="w1" d="M0 56 Q 25.0 20 50 56 T 100 56 T 150 56 T 200 56 T 250 56 T 300 56 T 350 56 T 400 56 T 450 56 T 500 56" fill="none" stroke="#fff" stroke-width="1.5"/>
      <path class="w2" d="M0 70 Q 40.0 40 80 70 T 160 70 T 240 70 T 320 70 T 400 70 T 480 70 T 560 70" fill="none" stroke="#fff" stroke-width="1" opacity=".7"/>
      <path class="w3" d="M0 40 Q 15.0 25 30 40 T 60 40 T 90 40 T 120 40 T 150 40 T 180 40 T 210 40 T 240 40 T 270 40 T 300 40 T 330 40 T 360 40 T 390 40 T 420 40 T 450 40 T 480 40" fill="none" stroke="#fff" stroke-width=".8" opacity=".5"/>
    </svg>
  </div>

  <section class="head">
    <div class="avatar-wrap"><div class="avatar" id="avatar"></div></div>
    <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <div class="meta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="location"></span>
    </div>
    <p class="bio" id="bio"></p>
    <div class="tags" id="tags"></div>
  </section>

  <div class="actions">
    <button class="btn btn-primary" id="saveBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span data-t="save">Save contact</span>
    </button>
    <button class="btn btn-ghost" id="shareBtn" aria-label="Share">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg>
    </button>
  </div>

  <nav class="quick" id="quick" aria-label="Portfolio"></nav>

  <ul class="links" id="links"></ul>

  <footer>
    <span id="year"></span>
    <button id="qrBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
      <span data-t="showQr">Show QR</span>
    </button>
  </footer>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="QR code">
  <div class="modal-box">
    <div class="qr" id="qr"></div>
    <p data-t="scan">Scan to open this card</p>
    <button class="btn" id="closeModal" data-t="close">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
// The card data is AES-GCM encrypted. The key travels only in the QR link (#k=…):
// browsers never send the #part to the server, and it is not in the repository.
const PAYLOAD = "2Hw1P6O48LtY15GQhBlOfK1Ofj62Whm0RJyCRXHW2bgMP9hD_0SEOhU5oLonoJPgpEJdUPOfwXLyvRB472LGChZmWzATUUoEXegpxDhCntspzURVENevgrbtbvHBAqmw7BK8ObjeWCUUi2hJhJVm4G23nIg1hWnA8C9KlNMfnSHtI72ARDLTCpgFTjOMGZsFDSRjIAyTLnUSZmn2o88Z2OllQwYg3m9t12-VuUsiRa8ra3IXvl90hyxRgGoCnx8shfdLcWosf4-G1hE6fegLFc1FteRbVV9_Lb8AuqOBHeangW1SSZKyBUs05hhrciUUH19SS1H_akdDrX38jl9IRgVWp65RkOqSaUkMNJjjbn4FDJBgKb23FtYBF5qDPTsCsR-n2L9GdT1YCtO_L5fB3bDQ9_sbczWKOeJzC0UXrnCZlygkRj8izuhjj9FqQ6Glpo7VJxbztS-cNn4L8J9w58DSo3LauL-b5sOw9VwdLr47HX1gzbua9BPLzwgDbGzEKQlXkc88EOvbmdiEIBEaNyXNnSmwdqyHPrDoOyps6WPGrzVMyj8d8Uz55TUKL1-GwtydocSt77zDws7ibcyzgxMPHpzien3nQReHWxTynitX407VYYuf8Y3m8IM13R2gGyRV_enIgNoxWy8wg3Mpf9sSVE8ZD2FRt5RYnSQvOec3sexPkjE_vZy9BUsw6VC9r1LLp2wEryb--tTFHWzeelCNyOcDDfIYD38cFASoH75BFBo69mnR7jOhE7yqE0iLTZzrtp5pj-KJmJ5dvcSSzkJhuh8RQR0LVNPB-ItHaBOIxqDbSuFBraSuWQZmWYg73EQBvAyiJdPm_OGfOFc1vonykqQYr8RpfR7zGjdt_XI0ccC7qp1cyMLGYaEL514WfpYbtmti21SUTXzsR8xOyf9SHavXvXvkN2d21zMjieC2ZO_Y_A2-r0UFxjL1F-jY6JwWgbkF";
const b64 = s => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(s + "=".repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
};
async function unlock() {
  const k = new URLSearchParams(location.hash.slice(1)).get("k");
  if (!k) return null;
  try {
    const raw = b64(PAYLOAD);
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  } catch { return null; }
}
const PROFILE = await unlock();
if (!PROFILE) {
  document.body.innerHTML = '<p class="locked">Not found</p>';
  throw new Error("locked");
}
document.body.classList.add("ready");

const ICONS = {
  portfolio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
  linkedin:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>',
  github:    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57l-.02-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22l-.01 3.29c0 .32.21.7.82.58A12 12 0 0 0 12 .3"/></svg>',
  whatsapp:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8A9 9 0 1 1 7.6 20.1L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>',
  email:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
  phone:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>'
};

// Interface en français ou en anglais selon la langue du téléphone
const FR = (navigator.language || "").toLowerCase().startsWith("fr");
const T = FR ? {
  save: "Enregistrer le contact", share: "Partager", showQr: "Afficher le QR", scan: "Scannez pour ouvrir cette carte",
  close: "Fermer", copied: "Lien copié", message: "Envoyez-moi un message", call: "Appeler",
  cv: "Mon CV", agent: "Demander à CK-AI", projects: "Mes projets", theme: "Changer de thème"
} : {
  save: "Save contact", share: "Share", showQr: "Show QR", scan: "Scan to open this card",
  close: "Close", copied: "Link copied", message: "Send me a message", call: "Call",
  cv: "My CV", agent: "Ask CK-AI", projects: "My projects", theme: "Toggle theme"
};
document.documentElement.lang = FR ? "fr" : "en";
document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]; });
document.getElementById("shareBtn").setAttribute("aria-label", T.share);
document.getElementById("themeBtn").setAttribute("aria-label", T.theme);

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
const P = PROFILE;
const fullName = `${P.firstName} ${P.lastName}`;
const cardUrl = P.cardUrl || location.href;  // keeps the #k= key, so shared links still open the card

const LINKS = [
  { key: "portfolio", label: "Portfolio",  sub: short(P.portfolio), href: P.portfolio, color: "linear-gradient(135deg,#4f6bff,#00c2b8)" },
  { key: "linkedin",  label: "LinkedIn",   sub: short(P.linkedin),  href: P.linkedin,  color: "#0a66c2" },
  { key: "github",    label: "GitHub",     sub: short(P.github),    href: P.github,    color: "#24292f" },
  { key: "whatsapp",  label: "WhatsApp",   sub: T.message, href: `https://wa.me/${P.whatsapp}`, color: "#1e8f4a" },
  { key: "email",     label: "Email",      sub: P.email,            href: `mailto:${P.email}`, color: "#d93025" },
  { key: "phone",     label: T.call,       sub: P.phone,            href: `tel:${P.phone.replace(/\s/g, "")}`, color: "#c2410c" }
];

// --- render ---
document.title = fullName;
document.getElementById("name").textContent = fullName;
document.getElementById("role").textContent = P.role;
document.getElementById("location").textContent = P.location;
document.getElementById("bio").textContent = P.bio;
document.getElementById("year").textContent = `© ${new Date().getFullYear()} ${fullName}`;
document.getElementById("tags").innerHTML = P.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("");

// Raccourcis vers le portfolio (CV dans la langue du téléphone, agent CK-AI, projets)
const site = P.portfolio.replace(/\/?$/, "/");
const page = FR ? site : site + "en/";
const QUICK = [
  { label: T.cv, href: site + (FR ? "CV_Kebaily.pdf" : "CV_Kebaily_EN.pdf"), icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>' },
  { label: T.agent, href: page + "#assistant", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/></svg>' },
  { label: T.projects, href: page + "#projets", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>' },
];
document.getElementById("quick").innerHTML = QUICK.map(q =>
  `<a href="${esc(q.href)}" target="_blank" rel="noopener">${q.icon}<span>${esc(q.label)}</span></a>`).join("");

const avatar = document.getElementById("avatar");
if (P.photo) avatar.innerHTML = `<img src="${esc(P.photo)}" alt="${esc(fullName)}">`;
else avatar.textContent = (P.firstName[0] + P.lastName[0]).toUpperCase();

document.getElementById("links").innerHTML = LINKS.map((l, i) => `
  <li><a class="link" href="${esc(l.href)}" ${/^https?:/.test(l.href) ? 'target="_blank" rel="noopener"' : ""} style="animation-delay:${0.25 + i * 0.06}s">
    <span class="ico" style="background:${l.color}">${ICONS[l.key]}</span>
    <span class="txt"><div class="label">${esc(l.label)}</div><div class="sub">${esc(l.sub)}</div></span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
  </a></li>`).join("");

// --- toast ---
const toast = msg => {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2000);
};

// --- save contact (vCard) ---
document.getElementById("saveBtn").onclick = () => {
  const vcf = [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${P.lastName};${P.firstName};;;`, `FN:${fullName}`,
    `TITLE:${P.role}`,
    `EMAIL;TYPE=INTERNET:${P.email}`,
    `TEL;TYPE=CELL:${P.phone}`,
    `URL:${P.portfolio}`,
    `X-SOCIALPROFILE;TYPE=linkedin:${P.linkedin}`,
    `X-SOCIALPROFILE;TYPE=github:${P.github}`,
    `NOTE:${P.bio}`,
    "END:VCARD"
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard" }));
  a.download = `${P.firstName}-${P.lastName}.vcf`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// --- share ---
document.getElementById("shareBtn").onclick = async () => {
  if (navigator.share) {
    try { await navigator.share({ title: fullName, text: P.role, url: cardUrl }); } catch {}
  } else {
    try { await navigator.clipboard.writeText(cardUrl); toast(T.copied); } catch { toast(cardUrl); }
  }
};

// --- QR modal ---
const modal = document.getElementById("modal");
let qrDone = false;
document.getElementById("qrBtn").onclick = () => {
  if (!qrDone && window.QRCode) {
    new QRCode(document.getElementById("qr"), { text: cardUrl, width: 440, height: 440, colorDark: "#0b0d12", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    qrDone = true;
  }
  modal.classList.add("open");
};
document.getElementById("closeModal").onclick = () => modal.classList.remove("open");
modal.onclick = e => { if (e.target === modal) modal.classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("open"); });

// --- inclinaison 3D et reflet (souris, doigt ou gyroscope) ---
const card = document.getElementById("card");
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let tx = 0, ty = 0, cx = 0, cy = 0, run = false;
  const loop = () => {
    cx += (tx - cx) * .12; cy += (ty - cy) * .12;
    card.style.transform = `rotateX(${cy * 8}deg) rotateY(${cx * 10}deg)`;
    card.style.setProperty("--mx", `${50 + cx * 50}%`);
    card.style.setProperty("--my", `${50 - cy * 50}%`);
    card.style.setProperty("--hx", `${50 + cx * 60}%`);
    if (Math.abs(tx - cx) > .001 || Math.abs(ty - cy) > .001) requestAnimationFrame(loop); else run = false;
  };
  const aim = (x, y) => { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); card.classList.add("live"); if (!run) { run = true; requestAnimationFrame(loop); } };
  const fromPointer = e => { const r = card.getBoundingClientRect(); aim((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1)); };
  card.addEventListener("pointermove", fromPointer);
  card.addEventListener("pointerleave", () => { aim(0, 0); card.classList.remove("live"); });
  // Android : le gyroscope incline la carte sans demander d'autorisation
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission !== "function") {
    addEventListener("deviceorientation", e => { if (e.gamma != null) aim(e.gamma / 30, -(e.beta - 45) / 30); });
  }
}

// --- theme toggle (remembered per device) ---
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch {}
document.getElementById("themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
};
</script>
</body>
</html>
