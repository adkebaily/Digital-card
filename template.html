<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d12">
<title>Business card</title>
<meta name="description" content="Digital business card">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f7;
    --card: #ffffff;
    --text: #0f1219;
    --muted: #5d6475;
    --line: rgba(15, 18, 25, 0.08);
    --row: #f6f7fa;
    --row-hover: #eceef3;
    --accent: #4f6bff;
    --accent-2: #00c2b8;
    --shadow: 0 30px 60px -20px rgba(20, 30, 60, 0.18), 0 2px 6px rgba(20, 30, 60, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #07080c;
      --card: #10131a;
      --text: #eef0f5;
      --muted: #9097a8;
      --line: rgba(255, 255, 255, 0.07);
      --row: #161a23;
      --row-hover: #1c212c;
      --accent: #7b8cff;
      --accent-2: #2de0d4;
      --shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
  }
  :root[data-theme="dark"] {
    --bg: #07080c; --card: #10131a; --text: #eef0f5; --muted: #9097a8;
    --line: rgba(255,255,255,0.07); --row: #161a23; --row-hover: #1c212c;
    --accent: #7b8cff; --accent-2: #2de0d4;
    --shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: minmax(0, 420px);
    justify-content: center;
    align-content: center;
    padding: 24px 16px 40px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  /* soft background glow */
  body::before {
    content: "";
    position: fixed;
    inset: -20vmax;
    background:
      radial-gradient(40vmax 40vmax at 15% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(35vmax 35vmax at 90% 90%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 60%);
    z-index: -1;
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  .banner {
    height: 112px;
    background:
      linear-gradient(135deg, var(--accent), var(--accent-2));
    position: relative;
    overflow: hidden;
  }
  /* subtle signal-wave motif — nod to signal processing */
  .banner svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; }

  .head { padding: 0 24px; margin-top: -48px; position: relative; }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 4px solid var(--card);
    background: linear-gradient(135deg, #1b2030, #2b3350);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 32px; letter-spacing: .5px;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .theme-toggle {
    position: absolute; right: 20px; top: 58px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--row);
    color: var(--muted); cursor: pointer;
    display: grid; place-items: center;
  }
  .theme-toggle:hover { color: var(--text); }

  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 14px; }
  .role {
    font-size: 14.5px; font-weight: 500; margin-top: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .bio { color: var(--muted); font-size: 14px; line-height: 1.55; margin-top: 14px; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tag {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    padding: 5px 9px; border-radius: 999px;
    background: var(--row); border: 1px solid var(--line); color: var(--muted);
  }

  .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 20px 24px 6px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; border-radius: 14px; border: 0; cursor: pointer;
    font: 600 15px "Inter", sans-serif; text-decoration: none;
    transition: transform .15s ease, filter .15s ease, background .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--text); color: var(--card); }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-ghost { width: 48px; background: var(--row); color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--row-hover); }

  .links { list-style: none; padding: 14px 16px 8px; display: grid; gap: 8px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; border-radius: 16px;
    background: var(--row); border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    transition: background .15s ease, transform .15s ease;
    opacity: 0; animation: fadeIn .5s ease forwards;
  }
  .link:hover { background: var(--row-hover); transform: translateX(2px); }
  .link:active { transform: scale(.985); }
  .ico {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: grid; place-items: center; color: #fff;
  }
  .ico svg { width: 20px; height: 20px; }
  .txt { min-width: 0; flex: 1; }
  .label { font-size: 14.5px; font-weight: 600; }
  .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .chev { color: var(--muted); flex: none; }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px 22px; color: var(--muted); font-size: 12px;
  }
  footer button {
    background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer;
    display: inline-flex; gap: 6px; align-items: center;
  }
  footer button:hover { color: var(--text); }

  /* QR modal (for sharing your card in person, screen to screen) */
  .modal {
    position: fixed; inset: 0; display: none; place-items: center; padding: 16px;
    background: rgba(5, 7, 12, .6); backdrop-filter: blur(6px); z-index: 10;
  }
  .modal.open { display: grid; }
  .modal-box {
    background: var(--card); border-radius: 24px; padding: 24px; text-align: center;
    width: 100%; max-width: 320px; box-shadow: var(--shadow); animation: rise .35s ease both;
  }
  .qr { background: #fff; border-radius: 16px; padding: 16px; display: inline-block; margin: 6px 0 14px; }
  .qr img, .qr canvas { display: block; width: 220px !important; height: 220px !important; }
  .modal-box p { color: var(--muted); font-size: 13px; }
  .modal-box .btn { width: 100%; margin-top: 16px; background: var(--row); color: var(--text); border: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--card); padding: 10px 16px; border-radius: 12px;
    font-size: 13.5px; font-weight: 500; opacity: 0; transition: all .25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  body:not(.ready) .card { visibility: hidden; }
  .locked { color: var(--muted); font-size: 15px; text-align: center; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .link { opacity: 1; }
  }
</style>
</head>
<body>

<main class="card">
  <div class="banner" aria-hidden="true">
    <svg viewBox="0 0 400 112" preserveAspectRatio="none">
      <path d="M0 56 Q 25 20 50 56 T 100 56 T 150 56 T 200 56 T 250 56 T 300 56 T 350 56 T 400 56" fill="none" stroke="#fff" stroke-width="1.5"/>
      <path d="M0 70 Q 40 40 80 70 T 160 70 T 240 70 T 320 70 T 400 70" fill="none" stroke="#fff" stroke-width="1" opacity=".7"/>
      <path d="M0 40 Q 15 25 30 40 T 60 40 T 90 40 T 120 40 T 150 40 T 180 40 T 210 40 T 240 40 T 270 40 T 300 40 T 330 40 T 360 40 T 390 40" fill="none" stroke="#fff" stroke-width=".8" opacity=".5"/>
    </svg>
  </div>

  <section class="head">
    <div class="avatar" id="avatar"></div>
    <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <div class="meta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="location"></span>
    </div>
    <p class="bio" id="bio"></p>
    <div class="tags" id="tags"></div>
  </section>

  <div class="actions">
    <button class="btn btn-primary" id="saveBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Save contact
    </button>
    <button class="btn btn-ghost" id="shareBtn" aria-label="Share">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg>
    </button>
  </div>

  <ul class="links" id="links"></ul>

  <footer>
    <span id="year"></span>
    <button id="qrBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
      Show QR
    </button>
  </footer>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="QR code">
  <div class="modal-box">
    <div class="qr" id="qr"></div>
    <p>Scan to open this card</p>
    <button class="btn" id="closeModal">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
// The card data is AES-GCM encrypted. The key travels only in the QR link (#k=…):
// browsers never send the #part to the server, and it is not in the repository.
const PAYLOAD = "__PAYLOAD__";
const b64 = s => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(s + "=".repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
};
async function unlock() {
  const k = new URLSearchParams(location.hash.slice(1)).get("k");
  if (!k) return null;
  try {
    const raw = b64(PAYLOAD);
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  } catch { return null; }
}
const PROFILE = await unlock();
if (!PROFILE) {
  document.body.innerHTML = '<p class="locked">Not found</p>';
  throw new Error("locked");
}
document.body.classList.add("ready");

const ICONS = {
  portfolio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
  linkedin:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>',
  github:    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57l-.02-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22l-.01 3.29c0 .32.21.7.82.58A12 12 0 0 0 12 .3"/></svg>',
  whatsapp:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8A9 9 0 1 1 7.6 20.1L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>',
  email:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
  phone:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>'
};

const short = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
const P = PROFILE;
const fullName = `${P.firstName} ${P.lastName}`;
const cardUrl = P.cardUrl || location.href;  // keeps the #k= key, so shared links still open the card

const LINKS = [
  { key: "portfolio", label: "Portfolio",  sub: short(P.portfolio), href: P.portfolio, color: "linear-gradient(135deg,#4f6bff,#00c2b8)" },
  { key: "linkedin",  label: "LinkedIn",   sub: short(P.linkedin),  href: P.linkedin,  color: "#0a66c2" },
  { key: "github",    label: "GitHub",     sub: short(P.github),    href: P.github,    color: "#24292f" },
  { key: "whatsapp",  label: "WhatsApp",   sub: "Send me a message", href: `https://wa.me/${P.whatsapp}`, color: "#25d366" },
  { key: "email",     label: "Email",      sub: P.email,            href: `mailto:${P.email}`, color: "#ea4335" },
  { key: "phone",     label: "Call",       sub: P.phone,            href: `tel:${P.phone.replace(/\s/g, "")}`, color: "#ff8a00" }
];

// --- render ---
document.title = fullName;
document.getElementById("name").textContent = fullName;
document.getElementById("role").textContent = P.role;
document.getElementById("location").textContent = P.location;
document.getElementById("bio").textContent = P.bio;
document.getElementById("year").textContent = `© ${new Date().getFullYear()} ${fullName}`;
document.getElementById("tags").innerHTML = P.tags.map(t => `<span class="tag">${t}</span>`).join("");

const avatar = document.getElementById("avatar");
if (P.photo) avatar.innerHTML = `<img src="${P.photo}" alt="${fullName}">`;
else avatar.textContent = (P.firstName[0] + P.lastName[0]).toUpperCase();

document.getElementById("links").innerHTML = LINKS.map((l, i) => `
  <li><a class="link" href="${l.href}" ${/^https?:/.test(l.href) ? 'target="_blank" rel="noopener"' : ""} style="animation-delay:${0.25 + i * 0.06}s">
    <span class="ico" style="background:${l.color}">${ICONS[l.key]}</span>
    <span class="txt"><div class="label">${l.label}</div><div class="sub">${l.sub}</div></span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
  </a></li>`).join("");

// --- toast ---
const toast = msg => {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2000);
};

// --- save contact (vCard) ---
document.getElementById("saveBtn").onclick = () => {
  const vcf = [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${P.lastName};${P.firstName};;;`, `FN:${fullName}`,
    `TITLE:${P.role}`,
    `EMAIL;TYPE=INTERNET:${P.email}`,
    `TEL;TYPE=CELL:${P.phone}`,
    `URL:${P.portfolio}`,
    `X-SOCIALPROFILE;TYPE=linkedin:${P.linkedin}`,
    `X-SOCIALPROFILE;TYPE=github:${P.github}`,
    `NOTE:${P.bio}`,
    "END:VCARD"
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard" }));
  a.download = `${P.firstName}-${P.lastName}.vcf`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// --- share ---
document.getElementById("shareBtn").onclick = async () => {
  if (navigator.share) {
    try { await navigator.share({ title: fullName, text: P.role, url: cardUrl }); } catch {}
  } else {
    try { await navigator.clipboard.writeText(cardUrl); toast("Link copied"); } catch { toast(cardUrl); }
  }
};

// --- QR modal ---
const modal = document.getElementById("modal");
let qrDone = false;
document.getElementById("qrBtn").onclick = () => {
  if (!qrDone && window.QRCode) {
    new QRCode(document.getElementById("qr"), { text: cardUrl, width: 440, height: 440, colorDark: "#0b0d12", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    qrDone = true;
  }
  modal.classList.add("open");
};
document.getElementById("closeModal").onclick = () => modal.classList.remove("open");
modal.onclick = e => { if (e.target === modal) modal.classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("open"); });

// --- theme toggle (remembered per device) ---
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch {}
document.getElementById("themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
};
</script>
</body>
</html>
